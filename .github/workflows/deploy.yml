name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:           # allow manual runs from the Actions tab

# Permissions required by the GitHub Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deployments; a newer push cancels a pending one
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js + Tailwind CSS ────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS (minified for production)
        run: npm run build:css

      # ── 3. .NET 10 ───────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      # ── 4. Fix base href for GitHub Pages subpath ────────────────────────────
      # Blazor WASM requires <base href> to match the deployment URL.
      # On GitHub Pages the app is served under /<repo-name>/, not /.
      - name: Set base href for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|g" wwwroot/index.html
          echo "Base href set to /$REPO/"

      # ── 5. Publish ───────────────────────────────────────────────────────────
      - name: Publish
        run: dotnet publish -c Release -o publish

      # ── 6. Prepare the Pages artifact ────────────────────────────────────────
      - name: Add .nojekyll
        # Prevents GitHub Pages' Jekyll from ignoring Blazor's _framework folder
        run: touch publish/wwwroot/.nojekyll

      - name: Copy index.html → 404.html for SPA deep-link routing
        # GitHub Pages serves 404.html for unknown paths.
        # The Blazor router then handles the URL on the client.
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      # ── 7. Deploy ────────────────────────────────────────────────────────────
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
